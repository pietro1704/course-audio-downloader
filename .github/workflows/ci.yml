name: CI

on:
  push:
  pull_request:

jobs:
  native-cloud:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Native Foundation boundary and bounded operations
        run: uv run --python 3.11 --with pyobjc-framework-Cocoa python -m unittest -v test_icloud_bridge test_native_cloud test_bounded_actions
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync
        run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: uv run python -m unittest -v
      - name: Repository hygiene check
        run: |
          git ls-files
          python - <<'PYTHON'
          import re
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          private = re.compile(r'(^|/)(config(\..*)?\.toml|.*cookies.*|.*inventory.*|.*report.*|logs/.*|.*\.(mp3|m4a|mp4))$')
          rejected = [p for p in paths if p != 'config.example.toml' and private.search(p)]
          if rejected:
              raise SystemExit('Private/generated tracked paths: ' + ', '.join(rejected))
          pattern = r'(gho_[A-Za-z0-9_]+|192\.168\.|cookies_file\s*=\s*"[^"]*(real|private|personal|prod)[^"]*")'
          result = subprocess.run(['git', 'grep', '-nE', pattern, '--', '.', ':!.gitignore'])
          if result.returncode != 1:
              raise SystemExit('Secret scan matched or failed')
          PYTHON
