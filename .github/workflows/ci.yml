name: CI

on:
  push:
  pull_request:

jobs:
  native-cloud:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Native Foundation boundary and bounded operations
        run: uv run --python 3.11 --with pyobjc-framework-Cocoa python -m unittest -v test_icloud_bridge test_native_cloud test_bounded_actions test_browser_activation test_document_failures
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        timeout-minutes: 5
        run: bash .github/scripts/install-ffmpeg.sh
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync
        run: uv sync --extra silence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install authenticated renderer
        timeout-minutes: 5
        run: uv run playwright install chromium
      - name: Tests
        run: uv run python -m unittest -v
      - name: Repository hygiene check
        run: |
          git ls-files
          python - <<'PYTHON'
          import re
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          private = re.compile(r'(^|/)(config(\..*)?\.toml|.*cookies.*|.*inventory.*|.*report.*|logs/.*|.*\.(mp3|m4a|mp4|pdf|epub|docx?|xlsx?|pptx?|zip))$')
          rejected = [p for p in paths if p != 'config.example.toml' and private.search(p)]
          if rejected:
              raise SystemExit('Private/generated tracked paths: ' + ', '.join(rejected))
          pattern = r'(gho_[A-Za-z0-9_]+|192\.168\.|cookies_file\s*=\s*"[^"]*(real|private|personal|prod)[^"]*")'
          result = subprocess.run(['git', 'grep', '-nE', pattern, '--', '.', ':!.gitignore'])
          if result.returncode != 1:
              raise SystemExit('Secret scan matched or failed')
          PYTHON

  portable-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash .github/scripts/install-ffmpeg.sh
      - name: Install FFmpeg on macOS and Windows
        if: runner.os != 'Linux'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install Python dependencies
        run: uv sync --python 3.12 --locked
      - name: Install authenticated renderer
        timeout-minutes: 5
        run: uv run playwright install chromium
      - name: URL CLI, browser session and local website regressions
        run: uv run python -m unittest -v test_authenticated_browser test_automatic_site test_course_discovery test_local_course test_local_portal test_local_portal_ui test_url_cli

  web-browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        timeout-minutes: 5
        run: bash .github/scripts/install-ffmpeg.sh
      - run: uv sync --python 3.12 --locked
      - name: Install website browser engines
        timeout-minutes: 5
        run: uv run playwright install --with-deps chromium firefox webkit
      - name: Website in Chromium, Firefox and WebKit
        env:
          COURSE_TEST_WEB_ENGINES: chromium,firefox,webkit
        run: uv run python -m unittest -v test_local_portal_ui
