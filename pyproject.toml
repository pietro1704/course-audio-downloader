[project]
name = "course-audio-downloader"
version = "0.1.3rc4"
description = "Personal authenticated course audio downloader"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
extractor = ["yt-dlp>=2026.8.19"]

[project.scripts]
course-audio-bot = "course_audio_bot:main"
course-deliver = "course_cli:main"
course-supervise = "queue_supervisor:main"
course-supervise-jobs = "job_supervisor:main"
[tool.uv]
package = true
[tool.setuptools]
py-modules = ["course_cli", "course_catalog", "site_profile", "course_audio_bot", "pipeline", "browser_adapter", "embedded_adapter", "media_transport", "cloud_delivery", "icloud_bridge", "artwork", "template_adapter", "extractor_adapter", "queue_supervisor", "job_supervisor", "transfer_errors", "file_delivery", "documents", "document_browser"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
